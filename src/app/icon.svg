<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background Chamfered Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#27272a" stroke-width="2" />
  <!-- "V" in Cyan-Blue -->
  <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="30" fill="url(#vGrad)">V</text>
  <!-- White Diagonal Slash Divider -->
  <line x1="33" y1="18" x2="29" y2="46" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- "S" in Crimson-Rose -->
  <text x="35" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="30" fill="url(#sGrad)">S</text>
</svg>
